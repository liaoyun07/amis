<!DOCTYPE html>
<html>
  <head>
    <meta charset=utf-8 />
    <title>系统</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link
      rel="stylesheet"
      title="default"
      href="https://unpkg.com/amis@3.2.0/sdk/antd.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/amis@3.2.0/sdk/helper.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/amis@3.2.0/sdk/iconfont.css"
    />
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/amis@3.2.0/sdk/sdk.js"></script>
    <script src="https://unpkg.com/vue@2"></script>
    <script src="https://unpkg.com/history@4.10.1/umd/history.js"></script>
    <style>
      html,
      body,
      .app-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .amis-scope .antd-Layout-brand{
        overflow: visible;
      }
      .amis-scope .antd-Layout--asideFixed .antd-Layout-brandBar{
        width: 250px;
      }
      .amis-scope .antd-Layout--asideFixed .antd-Layout-aside{
        width: 250px;
      }
      .antd-AsideNav-label{
        font-size: 15px!important;
        color: rgb(0, 153, 255) !important;
      }
      .child1{
        /* 使用 text-indent 来缩进文本 */
        text-indent: 1em; /* 这里的值可以根据需要调整，2em 通常相当于当前字体大小的两倍 */
      }
    </style>
  </head>
  <body>
    <div id="root" class="app-wrapper"></div>
    <script>
      (function () {

        //设置前后端地址，在本页面生效
        //API_HOST是后端服务地址
        //AMIS_HOST是前端服务地址
        //注意：在字符串中使用时字符串用反引号``而非单引号''才能生效
        const API_HOST = 'http://127.0.0.1:8080';
        const AMIS_HOST = 'http://127.0.0.1:3000';


        // 如果想用 browserHistory 请切换下这处代码, 其他不用变
        const history = History.createBrowserHistory();
        // const history = History.createHashHistory();

        // var role = 0;//后端不可用时测试用，正式使用应该默认为1
        var role = 1;

        $.ajax({
          async: false,
          url: `${API_HOST}/auth`,
          type: 'GET',
          dataType: 'json',
          contentType: 'application/json',
          headers: {
            'Authorization': localStorage.getItem("amis_token")
          },
          //请求成功且返回值为未登录
          success: function(response) {
            if (response.status === 9010){
              alert("账户已停用，请联系管理员");
            }
            if(response.status !== 200){
              window.location.href= `${AMIS_HOST}/login`;
            }
            role = response.data;
          },
          //请求失败(无法获取后端服务或网络有问题等)
          error: function(jqXHR, textStatus, errorThrown) {
            window.location.href= `${AMIS_HOST}/login`;
          }
        });


        let amis = amisRequire('amis/embed');
        const match = amisRequire('path-to-regexp').match;

        const user = {
          type: 'app',
          brandName: '集群管理系统',
          logo: '/public/logo.png',
          header: {
            type: 'tpl',
            inline: false,
            className: 'w-full',
          },
          // footer: '<div class="p-2 text-center bg-light">底部区域</div>',
          // asideBefore: '<div class="p-2 text-center">菜单前面区域</div>',
          // asideAfter: '<div class="p-2 text-center">菜单后面区域</div>',
          api: '/pages/user/site.json'
        };

        const admin = {
          type: 'app',
          brandName: 'ARM国产云-边-端协同平台',
          logo: '/public/logo.png',
          header: {
            type: 'tpl',
            inline: false,
            className: 'w-full',
          },
          // footer: '<div class="p-2 text-center bg-light">底部区域</div>',
          // asideBefore: '<div class="p-2 text-center">菜单前面区域</div>',
          // asideAfter: '<div class="p-2 text-center">菜单后面区域</div>',
          // api: "/example/site.json"
          api: "/pages/admin/site.json"
        };

        function normalizeLink(to, location = history.location) {
          to = to || '';

          if (to && to[0] === '#') {
            to = location.pathname + location.search + to;
          } else if (to && to[0] === '?') {
            to = location.pathname + to;
          }

          const idx = to.indexOf('?');
          const idx2 = to.indexOf('#');
          let pathname = ~idx
            ? to.substring(0, idx)
            : ~idx2
            ? to.substring(0, idx2)
            : to;
          let search = ~idx ? to.substring(idx, ~idx2 ? idx2 : undefined) : '';
          let hash = ~idx2 ? to.substring(idx2) : location.hash;

          if (!pathname) {
            pathname = location.pathname;
          } else if (pathname[0] != '/' && !/^https?\:\/\//.test(pathname)) {
            let relativeBase = location.pathname;
            const paths = relativeBase.split('/');
            paths.pop();
            let m;
            while ((m = /^\.\.?\//.exec(pathname))) {
              if (m[0] === '../') {
                paths.pop();
              }
              pathname = pathname.substring(m[0].length);
            }
            pathname = paths.concat(pathname).join('/');
          }

          return pathname + search + hash;
        }

        function isCurrentUrl(to, ctx) {
          if (!to) {
            return false;
          }
          const pathname = history.location.pathname;
          const link = normalizeLink(to, {
            ...location,
            pathname,
            hash: ''
          });

          if (!~link.indexOf('http') && ~link.indexOf(':')) {
            let strict = ctx && ctx.strict;
            return match(link, {
              decode: decodeURIComponent,
              strict: typeof strict !== 'undefined' ? strict : true
            })(pathname);
          }

          return decodeURI(pathname) === link;
        }



        if (role === 0){
          amisInstance = amis.embed(
                  '#root',
                  admin,
                  {
                    location: history.location,
                    data: {
                      // 全局数据，是受控的数据
                    },
                    context: {
                      // 全局上下文数据, 非受控的数据，无论哪一层都能获取到，包括弹窗自定义数据映射后都能获取到。
                      // 可以用来放一下全局配置等。比如 API_HOST, 这样页面配置里面可以通过 ${API_HOST} 来获取到。
                      // 仅对AMIS页面生效
                      API_HOST: API_HOST,
                      AMIS_HOST: AMIS_HOST
                    }
                  },
                  {

                    //全局配置函数，设置请求适配器和接收适配器
                    requestAdaptor(api, context){
                      api.headers.Authorization = localStorage.getItem("amis_token");
                      return api;
                    },

                    responseAdaptor(api, payload, query, request, response) {
                      if(payload.status === 200){
                        payload.status = 0;
                        payload.msg = payload.message;
                        delete payload.message;
                      }
                      return payload;
                    },


                    // watchRouteChange: fn => {
                    //   return history.listen(fn);
                    // },
                    updateLocation: (location, replace) => {
                      location = normalizeLink(location);
                      if (location === 'goBack') {
                        return history.goBack();
                      } else if (
                              (!/^https?\:\/\//.test(location) &&
                                      location ===
                                      history.location.pathname + history.location.search) ||
                              location === history.location.href
                      ) {
                        // 目标地址和当前地址一样，不处理，免得重复刷新
                        return;
                      } else if (/^https?\:\/\//.test(location) || !history) {
                        return (window.location.href = location);
                      }

                      history[replace ? 'replace' : 'push'](location);
                    },
                    jumpTo: (to, action) => {
                      if (to === 'goBack') {
                        return history.goBack();
                      }

                      to = normalizeLink(to);

                      if (isCurrentUrl(to)) {
                        return;
                      }

                      if (action && action.actionType === 'url') {
                        action.blank === false
                                ? (window.location.href = to)
                                : window.open(to, '_blank');
                        return;
                      } else if (action && action.blank) {
                        window.open(to, '_blank');
                        return;
                      }

                      if (/^https?:\/\//.test(to)) {
                        window.location.href = to;
                      } else if (
                              (!/^https?\:\/\//.test(to) &&
                                      to === history.pathname + history.location.search) ||
                              to === history.location.href
                      ) {
                        // do nothing
                      } else {
                        history.push(to);
                      }
                    },
                    isCurrentUrl: isCurrentUrl,
                    theme: 'antd'
                  }
          );
        }
        else {
          amisInstance = amis.embed(
                  '#root',
                  user,
                  {
                    location: history.location,
                    data: {
                      // 全局数据，是受控的数据
                    },
                    context: {
                      // 全局上下文数据, 非受控的数据，无论哪一层都能获取到，包括弹窗自定义数据映射后都能获取到。
                      // 可以用来放一下全局配置等。比如 API_HOST, 这样页面配置里面可以通过 ${API_HOST} 来获取到。
                      // 仅对AMIS页面生效
                      API_HOST: API_HOST,
                      AMIS_HOST: AMIS_HOST
                    }
                  },
                  {

                    //全局配置函数，设置请求适配器和接收适配器
                    requestAdaptor(api, context){
                      api.headers.Authorization = localStorage.getItem("amis_token");
                      return api;
                    },

                    responseAdaptor(api, payload, query, request, response) {
                      if(payload.status === 200){
                        payload.status = 0;
                        payload.msg = payload.message;
                        delete payload.message;
                      }
                      return payload;
                    },


                    // watchRouteChange: fn => {
                    //   return history.listen(fn);
                    // },
                    updateLocation: (location, replace) => {
                      location = normalizeLink(location);
                      if (location === 'goBack') {
                        return history.goBack();
                      } else if (
                              (!/^https?\:\/\//.test(location) &&
                                      location ===
                                      history.location.pathname + history.location.search) ||
                              location === history.location.href
                      ) {
                        // 目标地址和当前地址一样，不处理，免得重复刷新
                        return;
                      } else if (/^https?\:\/\//.test(location) || !history) {
                        return (window.location.href = location);
                      }

                      history[replace ? 'replace' : 'push'](location);
                    },
                    jumpTo: (to, action) => {
                      if (to === 'goBack') {
                        return history.goBack();
                      }

                      to = normalizeLink(to);

                      if (isCurrentUrl(to)) {
                        return;
                      }

                      if (action && action.actionType === 'url') {
                        action.blank === false
                                ? (window.location.href = to)
                                : window.open(to, '_blank');
                        return;
                      } else if (action && action.blank) {
                        window.open(to, '_blank');
                        return;
                      }

                      if (/^https?:\/\//.test(to)) {
                        window.location.href = to;
                      } else if (
                              (!/^https?\:\/\//.test(to) &&
                                      to === history.pathname + history.location.search) ||
                              to === history.location.href
                      ) {
                        // do nothing
                      } else {
                        history.push(to);
                      }
                    },
                    isCurrentUrl: isCurrentUrl,
                    theme: 'antd'
                  }
          );
        }



        history.listen(state => {
          amisInstance.updateProps({
            location: state.location || state
          });
        });
      })();
    </script>
  </body>
</html>
