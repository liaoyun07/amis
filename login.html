<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>登录</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <!-- <link rel="stylesheet" title="default" href="{% static 'amis/public/resource/sdk_2.1.0/sdk.css' %}" />
    <link rel="stylesheet" href="{% static 'amis/public/resource/helper.css' %}" />
    <script src="{% static 'amis/public/resource/sdk_2.1.0/sdk.js' %}"></script>
    <script src="{% static 'amis/public/resource/vue@2' %}"></script>
​ -->
    <link rel="stylesheet" title="default" href="https://unpkg.com/amis@2.4.0/sdk/sdk.css" />
    <link rel="stylesheet" href="https://unpkg.com/amis@2.4.1-beta.0/sdk/helper.css" />
    <script src="https://unpkg.com/amis@2.1.0/sdk/sdk.js"></script>
    <script src="https://unpkg.com/vue@2"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/md5.js"></script>
    <style>
        html,
        body,
        .app-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            margin: auto;
            padding: 0;
        }

        .loginTitle {
            text-align: center;
        }

        .loginTitle p {
            margin: 10px auto;
            color: black;
            font-size: 25px;
        }
        .cxd-Panel{
            width: 400px;
        }

        .login-button{
            /*display: block;*/
            /*margin: auto;*/
            /*position: relative;*/
            /*left: 133px;*/
            width: 75px; /* 自定义宽度 */
            height: 30px; /* 自定义高度 */
        }

        .button-registry{
            width: 75px; /* 自定义宽度 */
            height: 30px; /* 自定义高度 */
        }

        .button-submit{
            width: 75px; /* 自定义宽度 */
            height: 35px; /* 自定义高度 */
        }

        /*.button-group {*/
        /*    */
        /*}*/
        .amis-scope .cxd-ButtonGroup {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .amis-scope .cxd-ButtonGroup > .cxd-Button {
            max-width: 200px;
            overflow: auto;
        }

    </style>
</head>

<body>
<div id="root" class="app-wrapper"></div>
<script>
    (function() {

        //设置前后端地址，在本页面生效
        //API_HOST是后端服务地址
        //AMIS_HOST是前端服务地址
        //注意：在字符串中使用时字符串用反引号``而非单引号''才能生效
        const API_HOST = 'http://127.0.0.1:8080';
        const AMIS_HOST = 'http://127.0.0.1:3000';


        let amis = amisRequire('amis/embed');

        // 清理掉vue控制台无效打印
        // Vue.config.productionTip = false;
        // Vue.config.devtools = false

        // 全局后端url
        // const serverUrl = 'http://localhost:8081';
        // const serverUrl = location.origin;

        // 清理token
        // localStorage.removeItem("admins_token");

        const app = {
            type: 'page',
            title: "",
            style: {
                "backgroundImage": "linear-gradient(180deg, #86a4e9, transparent)"
            },
            cssVars: {
                "--Form-input-onFocused-borderColor": "#e8e9eb",
                "--Form-input-onHover-borderColor": "#e8e9eb",
            },
            body: {
                "type": "grid-2d",
                "cols": 12,
                "grids": [{
                    x: 5,
                    y: 6,
                    h: 1,
                    w: 4,
                    width: 200,
                    type: 'form',
                    align: "center",
                    valign: "auto",
                    mode: 'horizontal',
                    title: "",
                    // persistData: "user",
                    api: {
                        url: `${API_HOST}/user/login`,
                        method: "post",
                        // dataType: "form-data",
                        data:{
                            "userName": "${userName}",
                            "password": "${password}"
                        },
                        adaptor: function(payload, response, api) {
                            if (payload.status === 200) {
                                payload.status = 0;
                                localStorage.setItem('amis_token', payload.data);
                                payload.msg = payload.message;
                                delete payload.message;
                            }
                            else if (payload.status === 9000){
                                payload.msg = payload.message;
                                delete payload.message;
                            }
                            return payload;
                        },
                        // requestAdaptor(api) {
                        //     api.body.password = CryptoJS.MD5(api.body.password).toString()
                        // }
                    },
                    panelClassName: "p-r p-l p-b-md",
                    redirect: `${AMIS_HOST}/home`,
                    body: [
                        {
                        "type": "tpl",
                        "tpl": "<div class='loginTitle'><p>云边端协同数据流处理系统</p></div>"
                        },
                        {
                            type: "input-text",
                            label: false,
                            name: "userName",
                            size: "full",
                            placeholder: "用户名",
                            required: true,
                            addOn: {
                                "label": "",
                                "type": "text",
                                "position": "left",
                                "icon": "fa fa-user"
                            },
                        },
                        {
                            type: "input-password",
                            label: false,
                            name: "password",
                            size: "full",
                            placeholder: "密码",
                            required: true,
                            addOn: {
                                "label": "",
                                "type": "text",
                                "position": "left",
                                "icon": "fa fa-lock"
                            },
                        },
                        {
                            type: "checkbox",
                            label: false,
                            name: "record",
                            option: "记住密码"
                        },
                        {
                            "type": "button-group",
                            "className": "button-group",
                            "buttons": [
                                {
                                    type: "button",
                                    level: "primary",
                                    actionType: "submit",
                                    size: "lg",
                                    block: false,
                                    label: "登录",
                                    className: "login-button"
                                },
                                {
                                    "type": "button",
                                    "level": "primary",
                                    "className": "button-registry",
                                    "label": "注册",
                                    "actionType": "dialog",
                                    "dialog": {
                                        "type": "dialog",
                                        "title": "账号注册",
                                        "closeOnOutside": true,
                                        "closeOnEsc": true,
                                        "showErrorMsg": false,
                                        "body": [
                                            {
                                                "type": "form",
                                                "title": "表单",
                                                "api": {
                                                    "method": "post",
                                                    "url": `${API_HOST}/user/register`,
                                                    "dataType": "form-data",
                                                    "data": {
                                                        "userName": "${userName}",
                                                        "password": "${pass}"
                                                    },
                                                    "messages": {
                                                        "success": "注册成功"
                                                    },
                                                    "adaptor": "return {\n    ...payload,\n    status: payload.status === 200 ? 0 : payload.status,\n    msg: payload.message,\n    data: {response: payload.data}\n}"
                                                },
                                                "rules": [
                                                    {
                                                        "rule": "data.pass === data.passConfirm",
                                                        "message": "两次输入的密码不同"
                                                    }
                                                ],
                                                "body": [
                                                    {
                                                        "label": "用户名",
                                                        "type": "input-text",
                                                        "name": "userName",
                                                        "required": true
                                                    },
                                                    {
                                                        "label": "密码",
                                                        "type": "input-password",
                                                        "name": "pass",
                                                        "required": true
                                                    },
                                                    {
                                                        "label": "确认密码",
                                                        "type": "input-password",
                                                        "name": "passConfirm",
                                                        "required": true
                                                    }
                                                ],
                                                "redirect": `${AMIS_HOST}/login`,
                                            }
                                        ],
                                        "actions": [
                                            {
                                                "type": "submit",
                                                "label": "立即注册",
                                                "className": "button-submit",
                                                "actionType": "submit",
                                                "required": [
                                                    "userName",
                                                    "pass",
                                                    "passConfirm"
                                                ],
                                                "level": "info"
                                            }
                                        ]
                                    }
                                }
                            ]
                        }

                    ]
                }

                ]
            }
        };

        let amisInstance = amis.embed(
            '#root',

            app,

            {

            },

            {
                theme: 'cxd',
            }

        );


    })();
</script>
</body>

</html>
