<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>登录</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <link rel="stylesheet" title="default" href="https://unpkg.com/amis@2.4.0/sdk/sdk.css" />
    <link rel="stylesheet" href="https://unpkg.com/amis@2.4.1-beta.0/sdk/helper.css" />
    <script src="https://unpkg.com/amis@2.1.0/sdk/sdk.js"></script>
    <script src="https://unpkg.com/vue@2"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/md5.js"></script>
    <style>
        html,
        body,
        .app-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            margin: auto;
            padding: 0;
        }

        .loginTitle {
            text-align: center;
        }

        .loginTitle p {
            margin: 10px auto;
            color: black;
            font-size: 25px;
        }
        .cxd-Panel{
            width: 400px;
        }

        .login-button{
            display: block;
            margin: auto;
            position: relative;
            left: 133px;
            width: 75px; /* 自定义宽度 */
            height: 30px; /* 自定义高度 */
        }

    </style>
</head>

<body>
<div id="root" class="app-wrapper"></div>
<script>
    (function() {

        //设置前后端地址，在本页面生效
        //API_HOST是后端服务地址
        //AMIS_HOST是前端服务地址
        //注意：在字符串中使用时字符串用反引号``而非单引号''才能生效
        const API_HOST = 'http://127.0.0.1:8080'


        let amis = amisRequire('amis/embed');

        // 清理掉vue控制台无效打印
        // Vue.config.productionTip = false;
        // Vue.config.devtools = false

        // 全局后端url
        // const serverUrl = 'http://localhost:8081';
        // const serverUrl = location.origin;

        // 清理token
        // localStorage.removeItem("admins_token");

        const app = {
            type: 'page',
            title: "",
            style: {
                "backgroundImage": "linear-gradient(180deg, #86a4e9, transparent)"
            },
            cssVars: {
                "--Form-input-onFocused-borderColor": "#e8e9eb",
                "--Form-input-onHover-borderColor": "#e8e9eb",
            },
            body: {
                "type": "grid-2d",
                "cols": 12,
                "grids": [{
                    x: 5,
                    y: 6,
                    h: 1,
                    w: 4,
                    width: 200,
                    type: 'form',
                    align: "center",
                    valign: "auto",
                    mode: 'horizontal',
                    title: "",
                    persistData: "user",
                    api: {
                        url: `${API_HOST}/login`,
                        method: "post",
                        // dataType: "form-data",
                        data:{
                            "userName": "${userName}",
                            "password": "${password}"
                        },
                        adaptor: function(payload, response, api) {
                            if (payload.status === 200) {
                                payload.status = 0;
                                localStorage.setItem('amis_token', payload.data);
                                payload.msg = payload.message;
                                delete payload.message;
                            }
                            return payload;
                        },
                        // requestAdaptor(api) {
                        //     api.body.password = CryptoJS.MD5(api.body.password).toString()
                        // }
                    },
                    panelClassName: "p-r p-l p-b-md",
                    redirect: "/home",
                    body: [
                        {
                        "type": "tpl",
                        "tpl": "<div class='loginTitle'><p>集群管理系统</p></div>"
                        },
                        {
                            type: "input-text",
                            label: false,
                            name: "userName",
                            size: "full",
                            placeholder: "用户名",
                            required: true,
                            addOn: {
                                "label": "",
                                "type": "text",
                                "position": "left",
                                "icon": "fa fa-user"
                            },
                        },
                        {
                            type: "input-password",
                            label: false,
                            name: "password",
                            size: "full",
                            placeholder: "密码",
                            required: true,
                            addOn: {
                                "label": "",
                                "type": "text",
                                "position": "left",
                                "icon": "fa fa-lock"
                            },
                        },
                        // {
                        //     type: "checkbox",
                        //     label: false,
                        //     name: "record",
                        //     option: "记住密码"
                        // },
                        {
                            type: "button",
                            level: "primary",
                            actionType: "submit",
                            size: "lg",
                            block: false,
                            label: "登录",
                            className: "login-button"

                            // type: "control",
                            // label: false,
                            // body: {
                            //     "type": "button",
                            //     "level": "primary",
                            //     "actionType": "submit",
                            //     "size": "lg",
                            //     "block": false,
                            //     "label": "登录"
                            // }
                        }
                    ]
                }

                ]
            }
        };

        let amisInstance = amis.embed(
            '#root',

            app,

            {

            },

            {
                theme: 'cxd',
            }

        );


        // history.listen(state => {
        //     amisInstance.updateProps({
        //         location: state.location || state
        //     });
        // });


    })();
</script>
</body>

</html>
